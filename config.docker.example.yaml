# Docker 部署专用配置示例：复制为 config.docker.yaml 后填写
# 与宿主机直跑用的 config.yaml 的唯一区别是 mysql 段指向 compose 里的 db 服务
api_key: "在这里填你的 LLM API Key"
# 任何 OpenAI 兼容服务：换 base_url + 模型名即可切换厂商
base_url: ""
chat_model: ""
chat_thinking: ""
embedding_model: "embedding-3"
embedding_dims: 1024

mysql:
  host: db          # compose 服务名，容器网络内直连
  port: 3306        # 容器内端口，不需要宿主机转发
  user: root
  password: paperagent   # 与 docker-compose.yaml 的 MYSQL_ROOT_PASSWORD 一致
  database: paper_agent

server:
  host: 0.0.0.0
  port: 8787

# 容器内访问不了 arxiv.org 时填宿主机代理，注意要用宿主机可达地址：
# Docker Desktop（Windows/Mac）可用 host.docker.internal，如 http://host.docker.internal:7890
proxy: ""

source: auto
upload_dir: uploads

# 视觉识图：留空 = 关闭
vision_model: glm-5.3-flash
vision_max_figures: 10
